AWSTemplateFormatVersion: '2010-09-09'
Description: LibreChat — Secrets Manager secret and SSM Parameter Store configuration values

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

Resources:

  # ── Secrets Manager ──────────────────────────────────────────────────────────

  LibreChatSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'librechat/${Environment}/secrets'
      Description: !Sub 'LibreChat application secrets for ${Environment}'
      SecretString: |
        {
          "MONGO_URI": "mongodb://placeholder:placeholder@localhost:27017/LibreChat",
          "REDIS_URI": "rediss://:placeholder@localhost:6379",
          "REDIS_AUTH_TOKEN": "placeholder",
          "JWT_SECRET": "placeholder-jwt-secret-change-me",
          "JWT_REFRESH_SECRET": "placeholder-jwt-refresh-secret-change-me",
          "CREDS_KEY": "placeholder-creds-key-32-chars-min",
          "CREDS_IV": "placeholder-creds-iv-16c",
          "OPENAI_API_KEY": "placeholder",
          "ANTHROPIC_API_KEY": "placeholder",
          "MEILI_MASTER_KEY": "placeholder-meili-master-key",
          "EMAIL_FROM": "noreply@example.com",
          "GOOGLE_CLIENT_ID": "placeholder",
          "GOOGLE_CLIENT_SECRET": "placeholder",
          "DOCDB_USERNAME": "librechat",
          "DOCDB_PASSWORD": "placeholder-docdb-password-change-me"
        }

  # ── SSM Parameter Store — non-secret config ──────────────────────────────────

  ParamDomainClient:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/DOMAIN_CLIENT'
      Type: String
      Value: 'https://example.com'
      Description: Client-facing domain URL

  ParamDomainServer:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/DOMAIN_SERVER'
      Type: String
      Value: 'https://example.com'
      Description: Server-facing domain URL

  ParamMeiliHost:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/MEILI_HOST'
      Type: String
      Value: 'http://meili.librechat.local:7700'
      Description: MeiliSearch host URL

  ParamSearch:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/SEARCH'
      Type: String
      Value: 'false'
      Description: Enable MeiliSearch conversation search

  ParamLibreChatYaml:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/librechat_yaml'
      Type: String
      Value: |
        # LibreChat configuration — update post-deploy
        version: 1.0.0
        cache: true
      Description: librechat.yaml configuration content

  ParamConsoleJson:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/CONSOLE_JSON'
      Type: String
      Value: 'true'
      Description: Emit structured JSON logs

  ParamTrustProxy:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/TRUST_PROXY'
      Type: String
      Value: '1'
      Description: Express trust proxy setting

  ParamUploadsBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/UPLOADS_BUCKET'
      Type: String
      Value: 'placeholder-set-post-deploy'
      Description: S3 uploads bucket name (set after storage stack deploy)

  ParamFrontendBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/librechat/${Environment}/config/FRONTEND_BUCKET'
      Type: String
      Value: 'placeholder-set-post-deploy'
      Description: S3 frontend bucket name (set after frontend stack deploy)

Outputs:

  SecretArn:
    Description: ARN of the LibreChat Secrets Manager secret
    Value: !Ref LibreChatSecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'

  SecretName:
    Description: Name of the LibreChat Secrets Manager secret
    Value: !Sub 'librechat/${Environment}/secrets'
    Export:
      Name: !Sub '${AWS::StackName}-SecretName'

  ConfigParameterPath:
    Description: SSM Parameter Store path prefix for non-secret config values
    Value: !Sub '/librechat/${Environment}/config'
    Export:
      Name: !Sub '${AWS::StackName}-ConfigParameterPath'
