AWSTemplateFormatVersion: '2010-09-09'
Description: LibreChat — S3 frontend bucket, CloudFront distribution, WAF, ACM certificate, and Route 53 records

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
  CustomDomain:
    Type: String
    Default: ""
  HostedZoneId:
    Type: String
    Default: ""
  APIGatewayURL:
    Type: String
    Description: API Gateway invoke URL (e.g. https://abc123.execute-api.us-east-1.amazonaws.com)

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, ""]]

Resources:

  # ── S3 Frontend Bucket ────────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "librechat-frontend-${AWS::AccountId}-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # No static website hosting — content served exclusively via CloudFront OAC

  # ── WAF WebACL (must be CLOUDFRONT scope, deployed in us-east-1) ──────────

  FrontendWAFWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "librechat-frontend-waf-${Environment}"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "librechat-frontend-waf-${Environment}"
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSet

  # ── CloudFront Origin Access Control ─────────────────────────────────────

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "librechat-frontend-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── ACM Certificate (conditional on CustomDomain) ────────────────────────
  # Must be in us-east-1 for CloudFront — ensure this nested stack is deployed
  # in us-east-1 (CloudFront requires certificates in us-east-1).

  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CustomDomain
          HostedZoneId: !Ref HostedZoneId

  # ── CloudFront Distribution ───────────────────────────────────────────────

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "LibreChat frontend — ${Environment}"
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100

        # WAF
        WebACLId: !GetAtt FrontendWAFWebACL.Arn

        # Aliases + certificate (only when custom domain is provided)
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomain]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref FrontendCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        # Origins
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""   # empty — using OAC, not OAI
            OriginAccessControlId: !GetAtt FrontendOAC.Id

          - Id: APIGatewayOrigin
            # Strip the https:// scheme; CloudFront needs just the hostname
            DomainName: !Select
              - 2
              - !Split ["/", !Ref APIGatewayURL]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginPath: !Join
              - ""
              - - "/"
                - !Select [3, !Split ["/", !Ref APIGatewayURL]]

        # Cache behaviors
        CacheBehaviors:
          # /api/* → API Gateway, no cache
          - PathPattern: "/api/*"
            TargetOriginId: APIGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled (AWS managed)
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader (AWS managed)
            Compress: false

          # /*.js → S3, TTL=86400
          - PathPattern: "/*.js"
            TargetOriginId: S3FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetsCachePolicy
            Compress: true

          # /*.css → S3, TTL=86400
          - PathPattern: "/*.css"
            TargetOriginId: S3FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetsCachePolicy
            Compress: true

          # /*.woff2 → S3, TTL=86400
          - PathPattern: "/*.woff2"
            TargetOriginId: S3FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetsCachePolicy
            Compress: true

        # Default behavior: /* → S3, TTL=0 (index.html; SPA fallback via custom error)
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled (AWS managed)
          Compress: true

        # SPA routing: map 403/404 from S3 to index.html with 200
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # Cache policy for versioned static assets (JS/CSS/fonts)
  StaticAssetsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "librechat-static-assets-${Environment}"
        Comment: "TTL=86400 for versioned JS/CSS/font assets"
        DefaultTTL: 86400
        MinTTL: 86400
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # ── S3 Bucket Policy — grant CloudFront OAC read access ──────────────────

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ── Route 53 A alias record (conditional on CustomDomain) ────────────────

  FrontendDNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (fixed AWS value)
        EvaluateTargetHealth: false

Outputs:
  FrontendBucketName:
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketName"

  FrontendBucketArn:
    Value: !GetAtt FrontendBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketArn"

  CloudFrontURL:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
    Description: CloudFront distribution URL
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontURL"

  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
    Description: CloudFront distribution ID (used for cache invalidation)
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"
