AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LibreChat — GitHub Actions OIDC provider and deploy IAM role.
  Deploy this stack once per AWS account to enable keyless GitHub Actions deployments.
  Requirements: 7.6, 12.3

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization or user name (e.g. my-org)

  RepositoryName:
    Type: String
    Default: LibreChat
    Description: GitHub repository name

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: GitHub environment name to scope the trust policy.

Resources:

  # ── OIDC Identity Provider ────────────────────────────────────────────────
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub Actions OIDC thumbprint (AWS validates the certificate chain,
        # so this value is not security-critical but is required by the API)
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # ── Deploy IAM Role ───────────────────────────────────────────────────────
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub librechat-github-deploy-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${RepositoryName}:environment:${Environment}
      MaxSessionDuration: 3600
      Policies:
        # ── CloudFormation — scoped to librechat-* stacks ─────────────────
        - PolicyName: CloudFormationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/librechat-*/*
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-*/*
              - Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'

        # ── S3 — scoped to deployment and frontend/uploads buckets ────────
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:CreateBucket
                  - s3:PutBucketVersioning
                  - s3:PutBucketTagging
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketPublicAccessBlock
                Resource:
                  - !Sub arn:aws:s3:::librechat-*-${AWS::AccountId}-*
                  - !Sub arn:aws:s3:::librechat-*-${AWS::AccountId}-*/*
                  - arn:aws:s3:::aws-sam-cli-managed-*
                  - arn:aws:s3:::aws-sam-cli-managed-*/*

        # ── Lambda — scoped to librechat-* functions ──────────────────────
        - PolicyName: LambdaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:CreateAlias
                  - lambda:UpdateAlias
                  - lambda:DeleteAlias
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:InvokeFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:PutFunctionConcurrency
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                Resource:
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:function:librechat-*
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:*

        # ── IAM PassRole — allow CloudFormation to assume service roles ───
        - PolicyName: IAMPassRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/librechat-*
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:CreateServiceLinkedRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/librechat-*

        # ── Additional services needed for SAM deploy ─────────────────────
        - PolicyName: SAMDeploySupport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # API Gateway
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - arn:aws:apigateway:*::/apis/*
                  - arn:aws:apigateway:*::/apis
              # CloudFront (for cache invalidation)
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetDistribution
                  - cloudfront:UpdateDistribution
                Resource: '*'
              # CloudWatch (for smoke tests and observability stack)
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagResource
                Resource:
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/librechat-*:*
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/apigateway/librechat-*:*
                  - !Sub arn:aws:logs:*:${AWS::AccountId}:log-group:/ecs/librechat-*:*

      Tags:
        - Key: Purpose
          Value: github-actions-deploy
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  OIDCProviderArn:
    Description: ARN of the GitHub OIDC identity provider
    Value: !GetAtt GitHubOIDCProvider.Arn

  DeployRoleArn:
    Description: ARN of the deploy IAM role — set this as AWS_DEPLOY_ROLE_ARN in GitHub environment secrets
    Value: !GetAtt GitHubActionsDeployRole.Arn
