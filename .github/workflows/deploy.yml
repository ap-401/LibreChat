# deploy.yml — AWS SAM deployment pipeline for LibreChat
#
# Triggers:
#   - Push to main branch (deploys to dev)
#   - Manual workflow_dispatch with environment selection (dev/staging/prod)
#
# Authentication: OIDC (no long-lived credentials)
# Requirements: 12.3

name: Deploy LibreChat to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

permissions:
  id-token: write   # Required for OIDC AWS authentication
  contents: read

jobs:
  deploy:
    name: Build & Deploy (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS Credentials (OIDC) ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # ── Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Run API tests ──────────────────────────────────────────────────
      - name: Run API unit tests
        run: npm test --workspace=api

      # ── Build frontend ─────────────────────────────────────────────────
      - name: Build frontend
        run: npm run frontend

      # ── SAM Build ──────────────────────────────────────────────────────
      - name: SAM build
        run: sam build --config-env ${{ inputs.environment || 'dev' }}
        working-directory: aws-infra

      # ── SAM Deploy ─────────────────────────────────────────────────────
      - name: SAM deploy
        run: sam deploy --config-env ${{ inputs.environment || 'dev' }} --no-confirm-changeset
        working-directory: aws-infra

      # ── Sync frontend assets to S3 ─────────────────────────────────────
      - name: Sync frontend assets to S3
        run: bash aws-infra/scripts/build-frontend.sh ${{ inputs.environment || 'dev' }}

      # ── Invalidate CloudFront cache ────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: bash aws-infra/scripts/invalidate-cf.sh ${{ inputs.environment || 'dev' }}

      # ── Smoke tests ────────────────────────────────────────────────────
      - name: Run smoke tests
        run: bash aws-infra/scripts/smoke-test.sh ${{ inputs.environment || 'dev' }}
